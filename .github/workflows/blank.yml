name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check sources, local Markdown links and published study hashes
        run: python tools/check_repository.py
      - name: Install the dependency used by the existing unit tests
        run: python -m pip install numpy==2.3.5
      - name: Dynamics and fractals checks
        working-directory: studies/dynamics-fractals-sims
        run: python -m unittest -q
      - name: Social organization checks
        working-directory: studies/social-organization
        run: python test_model.py
      - name: Recovery and entrainment checks
        working-directory: studies/sims-recovery-entrainment
        run: python test_experiments.py
