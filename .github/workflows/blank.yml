name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  study-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore and verify published numerical data
        run: python tools/restore_numerical_data.py
      - name: Test lossless data restoration
        run: python -m unittest discover -s tools -p test_numerical_release.py -q
      - name: Check sources, local Markdown links and published study hashes
        run: python tools/check_repository.py
      - name: Install the dependencies used by the unit tests
        run: python -m pip install numpy==2.3.5 scipy==1.18.1
      - name: Dynamics and fractals checks
        working-directory: studies/dynamics-fractals-sims
        run: python -m unittest -q
      - name: Social organization checks
        working-directory: studies/social-organization
        run: python test_model.py
      - name: Recovery and entrainment checks
        working-directory: studies/sims-recovery-entrainment
        run: python test_experiments.py
      - name: Updated Hug equation and saved-result checks
        working-directory: studies/hug-active-guard
        run: |
          python -m unittest -q
          python verify_saved.py
      - name: Updated Hug offline animation checks
        run: node studies/hug-active-guard/check_player.cjs

      - name: Updated Hug live recovery checks
        working-directory: studies/hug-guard-sync
        run: |
          python -m unittest -q
          python verify_saved.py
      - name: Updated Hug live recovery animation checks
        run: node studies/hug-guard-sync/check_player.cjs

      - name: Public-record semantic audit and penalty checks
        working-directory: studies/community-record-tests
        run: |
          python -m unittest -q
          python verify_saved.py



      - name: Corrected corpus equations and real uptake records
        working-directory: studies/community-mimesis
        run: |
          python -m unittest -q
          python verify_saved.py

      - name: Full coupled corpus field and conditional real-record checks
        working-directory: studies/community-full-field
        run: |
          python -m unittest -q
          python verify_saved.py

      - name: Grounded reference field and observed-wording checks
        working-directory: studies/community-reference-field
        run: |
          python -m unittest -q
          python verify_saved.py

      - name: Hug retained-history equations and saved trajectories
        working-directory: studies/hug-memory-continuity
        run: |
          python -m unittest -q
          python verify_saved.py
      - name: Hug retained-history offline animation checks
        run: node studies/hug-memory-continuity/check_player.cjs

      - name: Hug movement-memory feedback equations and saved data
        working-directory: studies/hug-memory-feedback
        run: |
          python -m unittest -q
          python verify_saved.py
      - name: Hug movement-memory feedback offline animation checks
        run: node studies/hug-memory-feedback/check_player.cjs


      - name: Within person history and memory content checks
        working-directory: studies/community-two-in-one
        run: |
          python -m unittest -q
          python verify_saved.py

      - name: Hug larger-movement equations and saved results
        working-directory: studies/hug-movement-sweep
        run: |
          python -m unittest -q
          python verify_saved.py
      - name: Hug larger-movement offline animation checks
        run: node studies/hug-movement-sweep/check_player.cjs

  two-in-one-field-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install field test dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.18.1
      - name: Exact corpus equations and saved audit checks
        working-directory: studies/community-two-in-one-field
        run: |
          python -m unittest discover -p 'test_*.py' -q
          python verify_saved.py

  two-in-one-history-form-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact field test dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.18.1
      - name: Personal history and form specification checks
        working-directory: studies/community-two-in-one-application
        run: |
          python -m unittest discover -p 'test_*.py' -q
          python verify_saved.py
      - name: Miro source probes using full coupled dynamics
        working-directory: studies/community-two-in-one-application
        run: python check_miro_connections.py
      - name: Primary inner-experience source audit integrity
        working-directory: studies/community-two-in-one-application
        run: python primary_records/verify.py

  two-in-one-observation-bridge-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install full field check dependencies
        run: python -m pip install numpy==2.3.5 scipy==1.18.1
      - name: Observation connections and unchanged field equations
        working-directory: studies/community-observation-bridge
        run: |
          python -m unittest discover -p 'test_*.py' -v
          python verify_saved.py --published

  measured-inner-experience-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install measurement-analysis dependencies
        run: pip install -r studies/community-measured-inner-experience/requirements.txt
      - name: Check measurement accounting and saved artifacts
        working-directory: studies/community-measured-inner-experience
        run: |
          python -m unittest test_measurements.py -v
          python verify.py



  corpus-chain-audit-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install exact corpus audit dependencies
        run: pip install -r studies/community-chain-audit/requirements.txt
      - name: Verify published evidence and exact-equation conformance
        working-directory: studies/community-chain-audit
        run: |
          python verify.py
          python -m unittest test_audit.py -v
          python run_checks.py
